# Conda environment for "Learning Regularization Structure for Biosignal
# Template Estimation" (companion code).
#
#     conda env create -f environment.yml
#     conda activate template-estimation
#
# The pins are the versions the paper's results were reproduced with (Python
# 3.12); the bitwise reproduction depends on numpy and scipy.
name: template-estimation
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy=2.4.4
  - scipy=1.17.1
  - threadpoolctl=3.6.0
  - matplotlib=3.10.9
  - mne=1.12.1        # auditory EEG (MNE sample) and P300 preprocessing
  - pytest=9.0.3      # tests only
  - pip
  - pip:
      - moabb==1.5.0  # P300 BNCI2014-009 (data_loaders_p300.py)
      - wfdb==4.3.1   # MIT-BIH ECG record 119 (data_loaders_ecg.py)
